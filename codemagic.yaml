workflows:
  android-workflow:
    name: Compilar APK Android
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Obtener dependencias
        script: flutter pub get
      - name: Compilar APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

